<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>BeamerBuddy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-height workbench. 3D stage on the left, an instrument rack of tabs on the right; labels set condensed like lens spec sheets. */
:root{
  --bg:#E7EAEE; --surface:#F5F6F8; --raise:#FFFFFF; --ink:#141920; --muted:#586270; --line:#C9D0D8;
  --accent:#A3560A; --accent-soft:#F2E2CD; --on-accent:#FFFFFF;
  --good:#2B7849; --warn:#8F6400; --bad:#B42318;
  --scene:#D6DCE3; --scene-grid:#AEB7C2; --wall-base:#C3CAD3; --screen-base:#E2E6EB; --person:#6F7A88; --edge:#7E8896; --prop:#9A6B3F; --riser-base:#4A5160;
  --ax-x:#C2362B; --ax-y:#2B7849; --ax-z:#2F6AC2;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1014; --surface:#141820; --raise:#1B2129; --ink:#E3E7ED; --muted:#8B95A3; --line:#28303B;
  --accent:#EE9F45; --accent-soft:#3A2915; --on-accent:#1A1004;
  --good:#5CBD85; --warn:#DDB04A; --bad:#F07167;
  --scene:#090B0E; --scene-grid:#212832; --wall-base:#1B2129; --screen-base:#2A313B; --person:#9AA4B1; --edge:#55606D; --prop:#B88A5C; --riser-base:#262C35;
  --ax-x:#F07167; --ax-y:#5CBD85; --ax-z:#6FA8F0;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1014; --surface:#141820; --raise:#1B2129; --ink:#E3E7ED; --muted:#8B95A3; --line:#28303B;
  --accent:#EE9F45; --accent-soft:#3A2915; --on-accent:#1A1004;
  --good:#5CBD85; --warn:#DDB04A; --bad:#F07167;
  --scene:#090B0E; --scene-grid:#212832; --wall-base:#1B2129; --screen-base:#2A313B; --person:#9AA4B1; --edge:#55606D; --prop:#B88A5C; --riser-base:#262C35;
  --ax-x:#F07167; --ax-y:#5CBD85; --ax-z:#6FA8F0;
  color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px;gap:10px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px}
.brand small{font-weight:500;font-size:13px;letter-spacing:.08em;color:var(--muted)}
.brand i{display:inline-block;width:18px;height:12px;background:linear-gradient(90deg,var(--accent),transparent);clip-path:polygon(0 40%,100% 0,100% 100%,0 60%);font-style:normal}
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font-family:var(--f-disp);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:6px;padding:5px 10px;cursor:pointer;font-family:var(--f-disp);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:13px}
.btn:hover{border-color:var(--edge)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad)}
select,input[type=number],input[type=text]{background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:4px 6px;min-width:0}
.lbl{font-family:var(--f-disp);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
main{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:12px;min-height:0}
#view{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--scene);min-height:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-130%);font-family:var(--f-disp);font-weight:600;font-size:12px;letter-spacing:.05em;padding:1px 6px;border-radius:3px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.tag b{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.tag.dtag{transform:translate(-50%,-50%);font-family:var(--f-mono);font-weight:400;font-size:10.5px;letter-spacing:0;padding:1px 5px;opacity:.94}
.tag.dtag.dh{transform:translate(12px,-50%)}
.sugl .row{flex-wrap:nowrap;align-items:center;margin:4px 0;gap:8px}.sugl span{font-size:12px;line-height:1.35}
.dtag i{font-style:normal;margin-right:6px}.dtag .x{color:var(--ax-x)}.dtag .y{color:var(--ax-y)}.dtag .z{color:var(--ax-z)}.dtag .d{color:var(--muted)}
.hud{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 20px)}
.chip{font-family:var(--f-mono);font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--muted);width:max-content;max-width:100%}
#legend{position:absolute;left:10px;bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-width:calc(100% - 20px)}
#legend canvas{width:260px;max-width:100%;height:12px;border-radius:2px;display:block}
.ticks{position:relative;height:16px;width:260px;max-width:100%;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);top:2px}
.swatches{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px}
.swatches span{display:inline-flex;align-items:center;gap:5px}
.swatches i{width:10px;height:10px;border-radius:2px;display:inline-block}
#shiftAlert{position:absolute;left:50%;top:50px;transform:translateX(-50%);z-index:6;max-width:calc(100% - 20px);background:var(--warn);color:var(--bg);border-radius:6px;padding:7px 12px;font-size:13px;line-height:1.35;box-shadow:0 2px 10px rgba(0,0,0,.25);pointer-events:none}
#shiftAlert.over{background:var(--bad)}
#shiftAlert b{font-family:var(--f-disp);letter-spacing:.06em;text-transform:uppercase}
#shiftAlert div+div{margin-top:3px}
@media (prefers-reduced-motion:no-preference){#shiftAlert.flash{animation:shiftflash .45s ease-out}}
@keyframes shiftflash{0%{transform:translateX(-50%) scale(1)}35%{transform:translateX(-50%) scale(1.07)}100%{transform:translateX(-50%) scale(1)}}
.fld input.atmax{outline:2px solid var(--warn);outline-offset:0}
.shiftmeter{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:12px}
.shiftmeter:empty{display:none}
.shiftmeter span{color:var(--muted)}.shiftmeter em{font-style:normal;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.shiftmeter i{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.shiftmeter i b{display:block;height:100%;background:var(--good)}.shiftmeter i b.warn{background:var(--warn)}.shiftmeter i b.bad{background:var(--bad)}
.viewbtns{position:absolute;right:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.viewbtns .brk{flex-basis:100%;height:0}
aside{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:1 0 auto;border:0;background:transparent;padding:9px 10px;cursor:pointer;font-family:var(--f-disp);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{overflow:auto;padding:12px 14px 18px;flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:8px;text-wrap:balance}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 10px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.fld>span em{font-style:normal;font-family:var(--f-mono);letter-spacing:0;text-transform:none}
.fld input,.fld select{width:100%}
.fld.wide{grid-column:1/-1}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:7px;font-size:13px}
.check input{accent-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:4px}
.item{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--raise);cursor:pointer;text-align:left}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.item .dot{width:10px;height:10px;border-radius:50%}
.item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ro{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.readout{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.readout dt{color:var(--muted)}
.readout dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;min-width:0;overflow-wrap:anywhere}
.pill{display:inline-block;font-family:var(--f-disp);font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.note{font-size:12px;color:var(--muted);margin:0;max-width:65ch}
.msgs{display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none}
.msgs li{font-size:12.5px;padding:6px 8px;border-radius:5px;background:var(--raise);border:1px solid var(--line);border-left:3px solid var(--edge)}
.msgs li.warn{border-left-color:var(--warn);color:var(--ink)}
.msgs li.bad{border-left-color:var(--bad);color:var(--ink)}
.msgs li.ok{border-left-color:var(--good);color:var(--ink)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--raise)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--f-disp);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px;color:var(--muted);position:sticky;top:0;background:var(--raise)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
tr:last-child td{border-bottom:0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(640px,100%);max-height:90%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:200px;font-family:var(--f-mono);font-size:11.5px;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted);font-weight:400}
@media (max-width:900px){
  #app{height:auto;min-height:100%}
  main{grid-template-columns:1fr}
  #view{height:62vh;min-height:340px}
  aside{max-height:none}
  .panel{overflow:visible}
  #legend canvas,.ticks{width:200px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>


<div id="app">
  <header>
    <div class="brand"><i aria-hidden="true"></i>BeamerBuddy <small>projection planner</small></div>
    <div class="tb">
      <input id="sceneName" type="text" aria-label="Plan name" style="width:190px">
      <div class="seg" id="unitsSeg" role="group" aria-label="Length units"><button data-v="m">m</button><button data-v="ft">ft</button></div>
      <label class="row"><span class="lbl">Show</span>
        <select id="viewMode" aria-label="Surface display">
          <option value="lum">Brightness heatmap</option>
          <option value="real">Realistic glow</option>
          <option value="overlap">Overlap / blend zones</option>
          <option value="source">Which projector</option>
          <option value="edges">Image edges (coverage)</option>
          <option value="content">Content preview (images)</option>
        </select></label>
      <select id="lumUnit" aria-label="Brightness unit">
        <option value="nits">nits (cd/m²)</option>
        <option value="fl">foot-lamberts</option>
        <option value="lux">lux on surface</option>
      </select>
      <select id="presetSel" aria-label="Example plans">
        <option value="">Load example…</option>
        <option value="basic">Basic gallery (default)</option>
        <option value="gallery">Gallery: blended wall + floor</option>
        <option value="field">Outdoor sloped field</option>
        <option value="round">360° immersive room</option>
        <option value="concert">Band in front of a projection wall</option>
        <option value="theatre">Proscenium theatre with balcony</option>
        <option value="curve">Curved screen, 2.39:1</option>
      </select>
      <button class="btn" id="fileBtn">Save / load</button>
      <button class="btn" id="skpBtn">Export to SketchUp</button>
      <button class="btn" id="resetBtn">Reset</button>
    </div>
  </header>
  <main>
    <section id="view" aria-label="3D venue">
      <div id="labels"></div>
      <div class="hud"><div class="chip" id="hint">Drag objects to move them · drag space to orbit · WASD to walk, Q/E down/up, Shift for faster</div><div class="chip" id="perf"></div><div class="chip" id="dimnote" hidden>Floor-plan dimensions and height above the floor. All projector measurements are taken from the center of the projector body.</div></div>
      <div class="viewbtns">
        <div class="seg" id="dispSeg" role="group" aria-label="Surface display"><button data-v="lum">Luminance</button><button data-v="edges">Image edges</button><button data-v="content">Content</button></div>
        <div class="seg" id="camSeg" role="group" aria-label="Camera"><button data-v="orbit">Orbit</button><button data-v="top">Top</button><button data-v="pov">Lens view</button></div>
        <button class="btn sm" id="beamBtn" aria-pressed="true">Beams</button>
        <button class="btn sm" id="fastBtn" aria-pressed="true" title="While the camera moves: render at lower resolution and hide beams, image-edge outlines, model edges, dimensions and labels. Full detail returns when the camera stops.">Fast orbit</button>
        <div class="brk"></div>
        <div class="seg" id="distSeg" role="group" aria-label="Distances" title="Floor-plan dimensions, like a drafting top view: distance square to each screen face, to the walls around the object, and height above the floor. Projectors measure from the center of the body. Selected: everything for the selected object. All: height and screen distances for every projector, screen and riser."><button data-v="off">Dims off</button><button data-v="sel">Selected</button><button data-v="all">All</button></div>
      </div>
      <div id="shiftAlert" role="status" aria-live="polite" hidden></div>
      <div id="legend"></div>
    </section>
    <aside>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-t="venue">Venue</button>
        <button class="tab" role="tab" data-t="proj">Projectors</button>
        <button class="tab" role="tab" data-t="scr">Screens</button>
        <button class="tab" role="tab" data-t="ppl">People &amp; stage</button>
        <button class="tab" role="tab" data-t="rep">Report</button>
        <button class="tab" role="tab" data-t="cat">Catalog</button>
      </div>
      <div class="panel" id="panel"></div>
    </aside>
  </main>
</div>
<div class="modal" id="modal" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/TGALoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/ColladaLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

/* ---------- beams ---------- */
function buildBeams(){
  disposeGroup(G.beams);if(!S.beams)return;
  const meshes=rayBegin();
  for(const q of PJ){if(!q.on)continue;const col=new THREE.Color(q.p.color);
    const cs=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([sx,sy])=>{const d=q.f.clone().add(q.r.clone().multiplyScalar(q.cx+sx*q.Wc/2)).add(q.u.clone().multiplyScalar(q.cy+sy*q.Hc/2)).normalize();const h=castRay(q.L,d,meshes);return h?h.point:q.L.clone().add(d.multiplyScalar(30));});
    const pts=[];cs.forEach((c,i)=>{pts.push(q.L,c,c,cs[(i+1)%4]);});
    const lg=new THREE.BufferGeometry().setFromPoints(pts);G.beams.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.85})));
    const tri=[];cs.forEach((c,i)=>{tri.push(q.L,c,cs[(i+1)%4]);});
    const tg=new THREE.BufferGeometry().setFromPoints(tri);G.beams.add(new THREE.Mesh(tg,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.07,side:THREE.DoubleSide,depthWrite:false})));

}
const _rc=new THREE.Raycaster();
function rayBegin(){const ms=surfaces.filter(s=>!s.isModel).map(s=>s.mesh);ms.forEach(m=>m.material.side=THREE.DoubleSide);return ms;}
function rayEnd(ms){ms.forEach(m=>{m.material.side=m.userData.surfKey.startsWith('scr:')?THREE.DoubleSide:THREE.FrontSide;});}
function castRay(o,d,ms){_rc.set(o,d);_rc.far=Infinity;const h=ms.length?_rc.intersectObjects(ms,false)[0]:null;
  let best=h?{point:h.point,distance:h.distance,n:h.face.normal.clone().transformDirection(h.object.matrixWorld),key:h.object.userData.surfKey}:null;
  if(BVH&&S.mode==='model'){const b=bvhRay(o,d,best?best.distance:1e9);if(b)best=b;}return best;}

/* ---------- image edges: trace each side of every projector's picture onto whatever it lands on ---------- */
function buildOutlines(){
  disposeGroup(G.outl);if(S.view!=='edges')return;
  const meshes=rayBegin();
  const N=draft?60:180;
  for(const q of PJ){if(!q.on)continue;const hits=[];
    const corners=[[-1,-1],[1,-1],[1,1],[-1,1]];
    for(let e=0;e<4;e++){const [ax,ay]=corners[e],[bx,by]=corners[(e+1)%4];
      for(let i=0;i<=N;i++){const f=i/N;const sx=ax+(bx-ax)*f,sy=ay+(by-ay)*f;
        const d=q.f.clone().addScaledVector(q.r,q.cx+sx*q.Wc/2).addScaledVector(q.u,q.cy+sy*q.Hc/2).normalize();const h=castRay(q.L,d,meshes);
        if(!h){hits.push(null);continue;}const n=h.n.clone();if(n.dot(d)>0)n.negate();hits.push({p:h.point,n,o:h.key,dist:h.distance});}
      hits.push(null);}
    const pos=[];const w0=Math.max(.025,.0035*((stats.proj[q.p.id]||{}).dist||8));
    for(let i=0;i<hits.length-1;i++){const a=hits[i],b=hits[i+1];if(!a||!b||a.o!==b.o)continue;
      const seg=b.p.clone().sub(a.p);const len=seg.length();if(len>Math.max(.6,a.dist*.08))continue;
      const nn=a.n.clone().add(b.n).normalize();const side=seg.clone().cross(nn).normalize().multiplyScalar(w0/2);const lift=nn.clone().multiplyScalar(.015);
      const a1=a.p.clone().add(lift).add(side),a2=a.p.clone().add(lift).sub(side),b1=b.p.clone().add(lift).add(side),b2=b.p.clone().add(lift).sub(side);
      pos.push(a1.x,a1.y,a1.z,a2.x,a2.y,a2.z,b1.x,b1.y,b1.z, b1.x,b1.y,b1.z,a2.x,a2.y,a2.z,b2.x,b2.y,b2.z);}
    if(pos.length){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
      G.outl.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:new THREE.Color(q.p.color),side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2})));}
  }
  rayEnd(meshes);
}

/* ---------- lens and projector suggestions for where the projector stands now ---------- */
/* fill ratio for a body: content-area fraction of the raster (as in prep) sets how wide the image must be */
function needFor(m,p,s,dist){const asp=m.rw/m.rh,ca=p.content==='native'?asp:(aspectVal(p.content)||asp);

const SUG_TOL=.01;

function lensSuggest(p,s){const m=modelOf(p),dist=screenWorld(s,.5,.5).p.distanceTo(lensPos(p)),need=needFor(m,p,s,dist);
  const lname=(l,r)=>{const n=esc(l.name.split(' (')[0]);return /:1/.test(n)?n:`${n} (${r[0]===r[1]?r[0]:r[0]+'–'+r[1]}:1)`;};
  const useBtn=(mid,lid,t)=>`<button type="button" class="btn sm" data-use-model="${esc(mid)}" data-use-lens="${esc(lid)}">${t}</button>`;
  let h=`<p class="note">At ${fmtLen(dist)} from ${esc(s.name)}, filling it needs <b class="mono">${need.toFixed(2)}:1</b>.</p>`;
  const own=lensesFor(m).filter(l=>!l.custom).map(l=>({l,r:lensRangeFor(l,m,p)}));const fits=own.filter(o=>reaches(o.r,need));
  if(fits.length)return h+`<p class="note">Lenses for the ${esc(m.name)} that reach it from here:</p><div class="row">${fits.map(o=>useBtn(m.id,o.l.id,`${o.l.id===p.lens?'✓ ':''}${esc(o.l.name.split(' (')[0])}`)).join('')}</div>`;
  /* nearest lens for this body, and the distance it would need */
  const k=dist/need;let near=null,nd=Infinity;
  for(const o of own){const g=need<o.r[0]?o.r[0]/need:need/o.r[1];if(g<nd){nd=g;near=o;}}
  h+=`<p class="note">No lens for the ${esc(m.name)} reaches that.${near?` Closest: ${lname(near.l,near.r)}, which fills it from <b>${fmtLen(near.r[0]*k)}${near.r[0]===near.r[1]?'':' – '+fmtLen(near.r[1]*k)}</b> away.`:''}</p>`;

    for(const c of MODELS){if(c.custom||c.id===m.id||c.lm<lm0*lo||c.lm>lm0*hi)continue;const nc=needFor(c,p,s,dist);

  return h+`<p class="note">Projectors of similar brightness (the ${esc(m.name)} is ${lm0.toLocaleString()} lm) that fill it from this spot:</p><div class="sugl">${alt.slice(0,6).map(a=>`<div class="row">${useBtn(a.c.id,a.l.id,'Use')}<span><b>${esc(a.c.mfr)} ${esc(a.c.name)}</b> · ${a.c.lm.toLocaleString()} lm · ${lname(a.l,a.r)}</span></div>`).join('')}</div>`;}
function targetScreen(p){if(p.target!=='auto'){const s=S.screens.find(s=>s.id===p.target);if(s)return s;}const st=stats.proj[p.id];if(st&&st.tgt&&st.tgt.kind==='screen')return st.tgt.ref;return S.screens[0]||null;}

  if(st.keystone!=null&&st.keystone>20)out.push({lvl:'warn',t:`${p.name} meets its surface ${st.keystone.toFixed(0)}° off-axis. Expect keystone/warp correction and uneven brightness.`});
  const ss=shiftSpec(q.m,q.lens);
  if(ss){if(shiftUse(ss,p.shiftV,p.shiftH).f>1.005)out.push({lvl:ss.fixed?'bad':'warn',t:ss.fixed?`${p.name}: the ${q.m.name} has a fixed lens offset and no lens shift. Set shift V to ${ss.base}% and H to 0%, or pick the model again.`:`${p.name}: lens shift V ${p.shiftV}% / H ${p.shiftH}% is outside this lens's range of V ${ss.v[0]}% to ${ss.v[1]}%, H ${hRange(ss)}${ss.env==='diamond'||ss.circ?' (V and H share one range)':''}.`});}
  else if(Math.abs(p.shiftV)>60||Math.abs(p.shiftH)>30)out.push({lvl:'warn',t:`${p.name}: lens shift V ${p.shiftV}% / H ${p.shiftH}% is beyond what many zoom lenses allow. Check the lens spec.`});
  const o=orientOf(q.m),mk=mountOf(p);
  if(o){if(mk==='ceiling'&&o.ceil===false)out.push({lvl:'bad',t:`${p.name}: the ${q.m.name} can't be mounted upside down. Set Mounting to Table / floor or pick another projector.`});
    if(isPortrait(mk)&&o.port===false)out.push({lvl:'bad',t:`${p.name}: the ${q.m.name} isn't rated for portrait (on its side). Set Mounting to landscape or pick another projector.`});
    const trim=wrap180((+p.roll||0)-MOUNTS.find(x=>x[0]===mk)[2]);
    if(o.roll!=null&&Math.abs(trim)>o.roll+.25)out.push({lvl:'bad',t:`${p.name} is rolled ${Math.abs(trim).toFixed(1)}° off ${isPortrait(mk)?'its side':'level'}; the ${q.m.name} allows ±${o.roll}° side to side.`});
    if(!o.free&&o.tilt!=null&&Math.abs(p.pitch)>o.tilt+.25)out.push({lvl:'bad',t:`${p.name} is tilted ${Math.abs(p.pitch).toFixed(1)}° ${p.pitch<0?'down':'up'}; the ${q.m.name} is only rated for ±${o.tilt}°.${o.note?' '+o.note:''}`});}
  if(q.m.unc)out.push({lvl:'warn',t:`${p.name}: specs for the ${q.m.name} come from a partial or dealer listing. Confirm them with the maker.`});
  if(q.lens.no&&q.lens.no.some(k=>bodyKeys(q.m).includes(k)))out.push({lvl:'bad',t:`${p.name}: this lens is not listed for the ${q.m.name}.`});
  if(q.lens.est)out.push({lvl:'warn',t:`${p.name}: the ${q.lens.name} ratio on this chip is estimated from neighbouring lenses.`});
  return out;
}
function allWarnings(){
  const w=[];S.projectors.forEach(p=>w.push(...projWarnings(p)));
  S.screens.forEach(x=>{const st=stats.scr[x.id];if(!st)return;
    if(st.shadowBy){S.people.forEach((h,i)=>{const n=st.shadowBy[i];if(n>0){w.push({lvl:'bad',t:`${personLabel(h,i)} casts a shadow on ${x.name} (${pct(n/st.sf.N)} of its area).`});}});}
    if(st.cov>0&&st.cov<.98)w.push({lvl:'warn',t:`${x.name} is only ${pct(st.cov)} covered by projection.`});
    if(st.cov===0)w.push({lvl:'warn',t:`${x.name} receives no projection.`});
    if(st.cov>0&&st.avg<S.target*.7)w.push({lvl:'warn',t:`${x.name} averages ${fmtL(st.avg,x.gain)}, below the ${fmtL(S.target,x.gain)} target.`});
  });
  w.push(...stats.warn);return w;
}

  S.screens.forEach(x=>{const st=stats.scr[x.id];if(st)lines.push(`- ${x.name}: ${fmtLen(x.w,2)} × ${fmtLen(x.h,2)}${x.type==='curved'?` ${x.convex?'convex':'curved'}${{h:'',v:' top–bottom',both:' dish'}[bendOf(x)]} R ${fmtLen(x.R)}`:''}, gain ${x.gain}; coverage ${pct(st.cov)}, avg ${fmtL(st.avg,x.gain)}, min ${fmtL(st.mn,x.gain)}, max ${fmtL(st.mx,x.gain)}, overlap ${pct(st.ov)}, shadowed ${pct(st.shd)}`);});
  lines.push('','PROJECTORS');
  S.projectors.forEach(p=>{const st=stats.proj[p.id];if(!st)return;const q=st.q;lines.push(`- ${p.name}: ${q.m.mfr} ${q.m.name}, ${q.lens.name} at ${q.tr.toFixed(2)}:1; position X ${fmtLen(p.x)} Z ${fmtLen(p.z)} H ${fmtLen(p.h)} yaw ${p.yaw}° pitch ${p.pitch}°; throw ${fmtLen(st.dist)}; lands on ${st.tgt?st.tgt.label:'nothing'}`);});
  lines.push('','WARNINGS');allWarnings().forEach(w=>lines.push('- '+w.t));

}

function shiftState(p){const ss=shiftSpec(modelOf(p),lensOf(p));if(!ss||ss.fixed)return null;const u=shiftUse(ss,p.shiftV,p.shiftH);return {ss,...u,max:u.f>=.995,over:u.f>1.005};}

  if(st.fv>=.995)ax.push(`V ${pctS(p.shiftV)} (range ${pctS(ss.v[0])} to ${pctS(ss.v[1])})`);if(st.fh>=.995)ax.push(`H ${pctS(p.shiftH)} (range ${hRange(ss)})`);
  if(!ax.length)return `${esc(p.name)}: V ${pctS(p.shiftV)} with H ${pctS(p.shiftH)} ${st.over?'pushes':'puts'} the image corners ${st.over?'outside':'at the edge of'} the lens’s image circle`;

    [p1,p2].forEach((p,i)=>{const tx=i?7.1:3.9;const t=V(tx,sc.elev+sc.h/2,0.04);aimAt(p,t);zoomForWidth(p,6.9,lensPos(p).distanceTo(t));});
    const p3=newProjector({name:'P3 floor',model:'christie-dwu1100-gs',x:5.5,z:8.5,h:4.85,pitch:-90,yaw:0,color:COLORS[2]});p3.lens='gs-095';p3.zoom=.35;S.projectors.push(p3);
    S.people.push(newPerson({type:'standing',x:4.2,z:6.2}),newPerson({type:'standing',x:6.8,z:10.4,hh:1.9}),newPerson({type:'child',x:5.8,z:8.2}),newPerson({type:'floor',x:5.2,z:9.1}),newPerson({type:'chair',x:2.2,z:7.5}),newPerson({type:'wheel',x:8.6,z:6.5}));
    S.sel={kind:'proj',id:p1.id};
  }else if(name==='field'){
    S.name='Outdoor sloped field';S.mode='outdoor';S.site={L:70,W:60,rise:1,run:12,dir:0,gain:.18};S.ambient=1;S.target=75;S.room.H=10;
    const sc=newScreen({name:'Field screen',w:24,h:13.5,aspect:'16:9',x:30,z:6,elev:1.5,gain:1.0});S.screens.push(sc);
    const p1=newProjector({name:'P1 stack A',model:'christie-griffyn-4k50-rgb',x:29,z:48,h:2.2,color:COLORS[0]});p1.lens='ch4k-145217';
    const p2=newProjector({name:'P2 stack B',model:'christie-griffyn-4k50-rgb',x:31,z:48,h:2.2,color:COLORS[1]});p2.lens='ch4k-145217';
    S.projectors.push(p1,p2);
    [p1,p2].forEach(p=>{const t=screenWorld(sc,.5,.5).p;aimAt(p,t);const q=prep().find(x=>x.p===p);const dist=lensPos(p).distanceTo(t);const [a,b]=lensRange(p);const tr=dist/Math.max(sc.w/(q.Wc/q.W1),sc.h/(q.Hc/q.W1));p.zoom=clamp((tr-a)/(b-a),0,1);});
    for(let i=0;i<10;i++)S.people.push(newPerson({type:'floor',x:22+i*1.8,z:22}));
    for(let i=0;i<8;i++)S.people.push(newPerson({type:'chair',x:23+i*2,z:30}));
    S.people.push(newPerson({type:'standing',x:30.2,z:38,hh:1.85}),newPerson({type:'arms',x:29.6,z:45}),newPerson({type:'standing',x:12,z:40}));
    S.sel={kind:'scr',id:sc.id};
  }else if(name==='round'){
    S.name='360° immersive room';S.room={...S.room,L:16,W:16,H:5};S.ambient=.1;S.target=80;
    const R=6.5;const sc=newScreen({name:'Panorama',type:'curved',w:+(2*PI*R).toFixed(3),h:4.2,aspect:'custom',R,x:8,z:8-R,elev:.3,gain:1});S.screens.push(sc);
    for(let i=0;i<6;i++){const a=i*60;const p=newProjector({name:'P'+(i+1),model:'barco-g62-w14',x:8,z:8,h:4.6,color:COLORS[i%COLORS.length]});p.lens='g-065';
      p.x=+(8+Math.sin(a*D2R)*.5).toFixed(3);p.z=+(8+Math.cos(a*D2R)*.5).toFixed(3);p.yaw=a;p.pitch=-18;p.zoom=0;S.projectors.push(p);}
    S.people.push(newPerson({type:'standing',x:7,z:9}),newPerson({type:'standing',x:9.5,z:6.5}),newPerson({type:'floor',x:8.6,z:9.6}),newPerson({type:'child',x:6.2,z:7}));
    S.sel={kind:'scr',id:sc.id};
  }else if(name==='curve'){
    S.name='Curved screen, 2.39:1';S.room={...S.room,L:22,W:16,H:7};S.ambient=.1;S.target=48;
    const sc=newScreen({name:'Scope curve',type:'curved',w:13.4,h:5.6,aspect:'2.39:1',R:16,x:8,z:.3,elev:.8,gain:1.3});S.screens.push(sc);
    const p=newProjector({name:'Booth',model:'christie-griffyn-4k35-rgb',x:8,z:21.5,h:4.2,content:'2.39',color:COLORS[0]});p.lens='ch4k-113166';S.projectors.push(p);
    for(let r=0;r<4;r++)for(let i=0;i<8;i++)S.people.push(newPerson({type:'chair',x:4.5+i,z:10+r*1.6}));
    S.sel={kind:'proj',id:p.id};
    fitTemp(p,sc);
  }
  S.projectors.forEach(p=>{if(p.target==='auto'&&S.screens[0])p.target='auto';});
}
function fitTemp(p,s){const c=screenWorld(s,.5,.5).p;aimAt(p,c);const q=prep().find(x=>x.p===p);const dist=lensPos(p).distanceTo(c);const tr=dist/Math.max(chordOf(s)/(q.Wc/q.W1),chordHOf(s)/(q.Hc/q.W1));const [a,b]=lensRange(p);p.zoom=clamp((tr-a)/(b-a),0,1);}

/* ============================== SAVE / LOAD ============================== */
let saveT=null;
function save(){S.lib=LIB;clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('throwline:plan',JSON.stringify(S));}catch(e){}},400);}
function load(){try{const j=localStorage.getItem('throwline:plan');if(j){const o=JSON.parse(j);if(o&&o.projectors){return Object.assign(baseState(),o);}}}catch(e){}return null;}
function toast(t){const d=el('div','chip');d.style.cssText='position:absolute;left:50%;bottom:14px;transform:translateX(-50%);color:var(--ink);border-color:var(--accent);z-index:5;max-width:90%';d.textContent=t;view.append(d);setTimeout(()=>d.remove(),4200);}
function copyText(t){const done=()=>toast('Copied to clipboard');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>showText(t));}else showText(t);}
function showText(t){openModal('Copy this text',(b)=>{const ta=el('textarea');ta.value=t;ta.readOnly=true;b.append(ta);setTimeout(()=>{ta.focus();ta.select();},50);});}
function openModal(title,fill){const m=$('#modal');m.innerHTML='';const b=el('div','box');b.setAttribute('role','dialog');b.setAttribute('aria-label',title);const h=el('div','row');h.style.justifyContent='space-between';const ht=el('h3','',esc(title));ht.style.cssText='margin:0;font-family:var(--f-disp);letter-spacing:.06em;text-transform:uppercase';h.append(ht,btn('Close',()=>{m.hidden=true;}));b.append(h);fill(b);m.append(b);m.hidden=false;}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.hidden=true;});
$('#fileBtn').addEventListener('click',()=>openModal('Save or load a plan',b=>{
  b.append(el('p','note','Your plan is kept in this browser automatically. To move it elsewhere, copy the plan code below and paste it back in later, or load a .json plan file.'));
  const ta=el('textarea');ta.id='f-plan-json';ta.value=JSON.stringify(S,null,1);b.append(ta);
  const r=el('div','row');
  r.append(btn('Copy plan code',()=>{copyText(ta.value);}),btn('Load from text above',()=>{try{const o=JSON.parse(ta.value);S=Object.assign(baseState(),o);$('#modal').hidden=true;afterLoad();}catch(e){toast('That text isn’t a valid plan. Paste the full plan code, starting with {');}},'btn sm pri'));
  const fi=el('input');fi.type='file';fi.accept='.json,application/json';fi.id='f-plan-file';fi.addEventListener('change',()=>{const f=fi.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{ta.value=rd.result;};rd.readAsText(f);});
  const fl=el('label','fld');fl.append(el('span','','Open a plan file'),fi);
  b.append(r,fl);
  const r2=el('div','row');r2.append(btn('Start empty room',()=>{S=baseState();S.name='New gallery';$('#modal').hidden=true;afterLoad();},'btn sm danger'));b.append(r2);
}));
$('#resetBtn').addEventListener('click',()=>openModal('Reset the plan',b=>{
  b.append(el('p','note','This replaces the current plan with a basic interior gallery: a 12 × 9 × 4 m room, one 6 m 16:9 wall screen, one projector aimed and zoomed to fill it, and two visitors. Copy your plan code from Save / load first if you want to keep it.'));
  const r=el('div','row');r.append(btn('Reset to basic gallery',()=>{preset('basic');$('#modal').hidden=true;afterLoad();},'btn sm pri'),btn('Cancel',()=>{$('#modal').hidden=true;}));b.append(r);
}));
$('#presetSel').addEventListener('change',e=>{const v=e.target.value;if(!v)return;preset(v);e.target.value='';afterLoad();});
$('#sceneName').addEventListener('input',e=>{S.name=e.target.value;save();});
document.querySelectorAll('#unitsSeg button').forEach(b=>b.addEventListener('click',()=>{S.units=b.dataset.v;syncHeader();save();render();}));
function setView(v){S.view=v;$('#viewMode').value=v;document.querySelectorAll('#dispSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v?'true':'false'));dirty.compute=true;save();}
$('#viewMode').addEventListener('change',e=>setView(e.target.value));
document.querySelectorAll('#dispSeg button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));
$('#lumUnit').addEventListener('change',e=>{S.lumUnit=e.target.value;dirty.color=true;save();render();});
function syncHeader(){$('#sceneName').value=S.name;document.querySelectorAll('#unitsSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.units?'true':'false'));$('#viewMode').value=S.view;document.querySelectorAll('#dispSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.view?'true':'false'));$('#lumUnit').value=S.lumUnit;$('#beamBtn').setAttribute('aria-pressed',S.beams?'true':'false');document.querySelectorAll('#distSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===(S.dist||'off')?'true':'false'));}
function afterLoad(){setTimeout(loadContent,0);mergeLib(S.lib);S.th=Object.assign(thDefaults(),S.th||{});S.model=Object.assign(modelDefaults(),S.model||{});restoreModel();if(!Array.isArray(S.risers))S.risers=[];S.people.forEach(h=>{if(h.yaw==null)h.yaw=0;});S.projectors.forEach(p=>{const d=newProjector();for(const k in d)if(p[k]===undefined)p[k]=d[k];});S.screens.forEach(s=>{if(typeof s.convex==='string')s.convex=s.convex==='true';});
  syncHeader();dirty.surf=dirty.objs=dirty.compute=true;setCam('orbit');save();render();}

function restoreModel(){if(S.mode!=='model'||!S.model.name)return;if(MODELFILE&&MODELFILE.name===S.model.name&&RAWMODEL){rebuildModel();return;}
  idbGet().then(v=>{if(v&&v.name===S.model.name){loadModelData(v.name,v.ext,v.data,false);}else{MODELMSG=`Import ${S.model.name} again to see the model on this device.`;render();}}).catch(()=>{MODELMSG='This browser blocked storage. Import the model file again.';render();});}
/* ============================== BOOT ============================== */
loadLib();S=load();if(S){mergeLib(S.lib);S.th=Object.assign(thDefaults(),S.th||{});S.model=Object.assign(modelDefaults(),S.model||{});restoreModel();if(!Array.isArray(S.risers))S.risers=[];}else{preset('gallery');}
S.units='ft';/* the app always opens in feet; the m / ft switch still changes it for the session */
try{const t=localStorage.getItem('throwline:tab');if(t)tab=t;}catch(e){}
resize();syncHeader();buildSurfaces();buildObjects();compute();loadContent();setCam('orbit');setTab(tab);dirty.surf=dirty.objs=false;dirty.compute=false;
loop();
})();
</script>

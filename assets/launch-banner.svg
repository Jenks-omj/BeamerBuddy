<svg xmlns="http://www.w3.org/2000/svg" width="820" height="150" viewBox="0 0 820 150" role="img" aria-labelledby="t">
  <title id="t">BeamerBuddy, click to launch</title>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EE9F45" stop-opacity=".9"/>
      <stop offset="1" stop-color="#EE9F45" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141820"/>
      <stop offset="1" stop-color="#0D1014"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#212832" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="820" height="150" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="818" height="148" rx="13" fill="url(#grid)" opacity=".7"/>
  <rect x="1" y="1" width="818" height="148" rx="13" fill="none" stroke="#28303B" stroke-width="2"/>

  <!-- projector throwing a beam onto a screen -->
  <rect x="34" y="62" width="44" height="28" rx="5" fill="#EE9F45"/>
  <circle cx="78" cy="76" r="7" fill="#1A1004" stroke="#EE9F45" stroke-width="3"/>
  <polygon points="84,72 84,80 196,112 196,40" fill="url(#beam)"/>
  <rect x="196" y="36" width="8" height="80" rx="2" fill="#E3E7ED"/>

  <g font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-stretch="condensed">
    <text x="232" y="74" fill="#E3E7ED" font-size="40" font-weight="700" textLength="250" lengthAdjust="spacingAndGlyphs">BEAMERBUDDY</text>
    <text x="234" y="104" fill="#8B95A3" font-size="16" font-weight="500" textLength="250" lengthAdjust="spacingAndGlyphs">PROJECTION PLANNER · IN YOUR BROWSER</text>
  </g>

  <!-- launch button -->
  <rect x="590" y="49" width="200" height="52" rx="26" fill="#EE9F45"/>
  <polygon points="616,63 616,87 636,75" fill="#1A1004"/>
  <text x="646" y="83" fill="#1A1004" font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-stretch="condensed" font-size="22" font-weight="700" textLength="128" lengthAdjust="spacingAndGlyphs">CLICK TO LAUNCH</text>
</svg>
